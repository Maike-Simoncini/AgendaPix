<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgendaPix - Gerenciador de Chaves</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Barra de rolagem customizada */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

    <div class="max-w-5xl mx-auto px-4 py-8">
        
        <!-- Cabeçalho -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">
                AgendaPix
            </h1>
            <p class="text-slate-400 mt-2 text-sm sm:text-base">
                Sua agenda segura e offline para armazenar e exportar chaves Pix frequentemente utilizadas.
            </p>
        </header>

        <main class="grid grid-cols-1 gap-8">
            
            <!-- FORMULÁRIO DE CADASTRO -->
            <section class="bg-slate-800 border border-slate-700/50 rounded-2xl p-6 shadow-xl">
                <h2 class="text-xl font-bold text-blue-400 mb-6 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
                    Adicionar Novo Contato
                </h2>
                
                <form id="formPix" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Nome do Contato / Empresa</label>
                        <input type="text" id="nome" required class="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors" placeholder="Ex: Maria Souza">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Tipo de Chave</label>
                        <select id="tipoChave" required class="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition-colors">
                            <option value="" disabled selected class="text-slate-500">Selecione o tipo...</option>
                            <option value="CPF">CPF</option>
                            <option value="CNPJ">CNPJ</option>
                            <option value="E-mail">E-mail</option>
                            <option value="Telefone">Telefone</option>
                            <option value="Chave Aleatória">Chave Aleatória</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Chave Pix</label>
                        <input type="text" id="chave" required class="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors" placeholder="Insira a chave Pix aqui">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Banco / Instituição (Opcional)</label>
                        <input type="text" id="banco" class="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors" placeholder="Ex: Nubank, Itaú, Inter">
                    </div>
                    
                    <div class="sm:col-span-2 mt-2">
                        <button type="submit" class="w-full sm:w-auto float-right bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-600 hover:to-cyan-600 text-slate-950 font-bold py-2.5 px-6 rounded-lg transition-all shadow-lg shadow-blue-500/10">
                            Salvar na Agenda
                        </button>
                    </div>
                </form>
            </section>

            <!-- LISTA DE CONTATOS -->
            <section class="bg-slate-800 border border-slate-700/50 rounded-2xl p-6 shadow-xl">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <h2 class="text-xl font-bold text-cyan-400 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
                        Chaves Salvas
                    </h2>
                    
                    <button id="btnExportarTxt" class="w-full sm:w-auto flex items-center justify-center gap-2 bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-600 hover:to-cyan-600 text-slate-950 font-bold py-2 px-4 rounded-lg transition-all shadow-md">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                        Exportar Agenda (.txt)
                    </button>
                </div>

                <!-- Tabela Responsiva -->
                <div class="overflow-x-auto w-full rounded-xl border border-slate-700/60">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-700/40 text-slate-300 text-xs uppercase tracking-wider border-b border-slate-700">
                                <th class="py-3 px-4">Contato</th>
                                <th class="py-3 px-4">Tipo</th>
                                <th class="py-3 px-4">Chave Pix</th>
                                <th class="py-3 px-4">Banco</th>
                                <th class="py-3 px-4 text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaCorpo" class="divide-y divide-slate-700/50 text-sm text-slate-300">
                            <!-- Preenchido via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        const STORAGE_KEY = 'agenda_pix_app_data';

        let agendaContatos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

        const form = document.getElementById('formPix');
        const tabelaCorpo = document.getElementById('tabelaCorpo');
        const btnExportar = document.getElementById('btnExportarTxt');

        // Mensagem de feedback Toast elegante
        function mostrarToastSucesso() {
            const toast = document.createElement('div');
            toast.className = "fixed bottom-5 right-5 bg-slate-800 border border-blue-500/30 text-white px-5 py-3.5 rounded-xl shadow-2xl flex items-center gap-3 transform translate-y-10 opacity-0 transition-all duration-300 z-50";
            
            toast.innerHTML = `
                <div class="bg-blue-500/10 p-1.5 rounded-lg text-cyan-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                    </svg>
                </div>
                <div>
                    <p class="font-semibold text-sm text-white">Agenda Exportada!</p>
                    <p class="text-xs text-slate-400">O arquivo de texto foi salvo com sucesso.</p>
                </div>
            `;
            
            document.body.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 100);
            
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => document.body.removeChild(toast), 300);
            }, 3000);
        }

        // Renderizar linhas da tabela de contatos
        function atualizarTabela() {
            tabelaCorpo.innerHTML = '';

            if (agendaContatos.length === 0) {
                tabelaCorpo.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-8 text-center text-slate-500 italic">
                            Nenhum contato cadastrado na sua AgendaPix.
                        </td>
                    </tr>
                `;
                return;
            }

            agendaContatos.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-700/20 transition-colors";
                tr.innerHTML = `
                    <td class="py-3.5 px-4 font-medium text-white">${item.nome}</td>
                    <td class="py-3.5 px-4"><span class="px-2 py-0.5 rounded text-xs bg-slate-700 text-slate-300 font-mono">${item.tipoChave}</span></td>
                    <td class="py-3.5 px-4 font-mono text-cyan-400 select-all" title="Dê um duplo clique para selecionar a chave">${item.chave}</td>
                    <td class="py-3.5 px-4 text-slate-400">${item.banco || '-'}</td>
                    <td class="py-3.5 px-4 text-center">
                        <button onclick="removerContato(${index})" class="text-red-400 hover:text-red-500 p-1.5 rounded bg-red-500/10 hover:bg-red-500/20 transition-colors" title="Excluir">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </td>
                `;
                tabelaCorpo.appendChild(tr);
            });
        }

        // Submissão do Formulário e Persistência
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const novoContato = {
                nome: document.getElementById('nome').value,
                tipoChave: document.getElementById('tipoChave').value,
                chave: document.getElementById('chave').value,
                banco: document.getElementById('banco').value
            };

            agendaContatos.push(novoContato);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(agendaContatos));

            form.reset();
            atualizarTabela();
        });

        // Remover item individual
        window.removerContato = function(index) {
            if (confirm(`Remover o contato "${agendaContatos[index].nome}" da sua agenda?`)) {
                agendaContatos.splice(index, 1);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(agendaContatos));
                atualizarTabela();
            }
        }

        // Gerar arquivo .txt estruturado e limpo
        btnExportar.addEventListener('click', () => {
            if (agendaContatos.length === 0) {
                alert('Sua agenda está vazia. Adicione contatos antes de exportar.');
                return;
            }

            const dataFormatada = new Date().toLocaleString('pt-BR');
            let txtContent = `=========================================\n`;
            txtContent += `             AGENDA PIX - BACKUP         \n`;
            txtContent += ` Exportado em: ${dataFormatada} \n`;
            txtContent += `=========================================\n\n`;

            agendaContatos.forEach((item, index) => {
                txtContent += `-----------------------------------------\n`;
                txtContent += ` CONTATO #${index + 1}\n`;
                txtContent += `-----------------------------------------\n`;
                txtContent += `Nome/Beneficiário: ${item.nome}\n`;
                txtContent += `Tipo de Chave    : ${item.tipoChave}\n`;
                txtContent += `Chave Pix        : ${item.chave}\n`;
                txtContent += `Instituição/Banco: ${item.banco || 'Não informado'}\n\n`;
            });

            const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            
            const dataIso = new Date().toISOString().slice(0, 10);
            link.download = `Backup_AgendaPix_${dataIso}.txt`;
            
            document.body.appendChild(link);
            link.click();
            
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            mostrarToastSucesso();
        });

        // Inicializar tabela ao carregar a página
        atualizarTabela();
    </script>
</body>
</html>
